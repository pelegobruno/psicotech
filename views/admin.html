<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão ADM - Psicomind</title>
    
    <link rel="icon" href="../img/favicon.png?v=2" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ESTILO EXCLUSIVO DO ADMIN PARA GARANTIR O TEMA DARK DAS FOTOS */
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --green-bg: #064e3b;
            --green-border: #065f46;
            --green-text: #34d399;
            --red-bg: #450a0a;
            --red-border: #7f1d1d;
            --red-text: #f87171;
        }
        * { box-sizing: border-box; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        
        .app-layout { display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar (Menu Esquerdo) */
        .sidebar { width: 250px; background-color: var(--bg-panel); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .sidebar-header { padding: 25px 20px; }
        .sidebar-header h2 { margin: 0; font-size: 18px; color: var(--text-main); font-weight: 700; }
        .sidebar-header p { margin: 5px 0 0 0; font-size: 12px; color: var(--text-muted); }
        .sidebar-header p strong { color: var(--accent-blue); font-weight: 600; }
        
        .sidebar-menu { padding: 20px 0; flex: 1; }
        .menu-btn { width: 100%; display: block; padding: 15px 20px; text-align: left; background: transparent; border: none; color: var(--text-muted); font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .menu-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
        .menu-btn.active { color: var(--text-main); background-color: var(--border-color); border-left: 3px solid var(--accent-blue); }
        
        .sidebar-footer { padding: 20px; margin-top: auto; } /* Fica preso em baixo */
        .btn-sair-outline { width: 100%; padding: 12px; background: transparent; border: 1px solid #ef4444; color: #ef4444; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.2s; }
        .btn-sair-outline:hover { background: #ef4444; color: white; }

        /* Area Principal */
        .content-area { flex: 1; padding: 40px; overflow-y: auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        h1.page-title { font-size: 22px; margin-top: 0; margin-bottom: 25px; font-weight: 600; }

        /* Dashboard Financeiro (Cards) */
        .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .kpi-card { padding: 25px 20px; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--bg-panel); }
        .kpi-card.green { background-color: var(--green-bg); border-color: var(--green-border); }
        .kpi-card.red { background-color: var(--red-bg); border-color: var(--red-border); }
        .kpi-card h3 { font-size: 13px; font-weight: 500; margin: 0 0 10px 0; color: var(--text-muted); }
        .kpi-card.green h3 { color: var(--green-text); }
        .kpi-card.red h3 { color: var(--red-text); }
        .kpi-card p { font-size: 32px; font-weight: 700; margin: 0; }
        .kpi-card.green p { color: #10b981; }
        .kpi-card.red p { color: #ef4444; }

        /* Gestão de Psicólogos (Tabela) */
        .search-box { width: 100%; padding: 15px 20px; background-color: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 14px; margin-bottom: 25px; outline: none; }
        .search-box::placeholder { color: var(--text-muted); }
        
        .table-container { background-color: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; }
        .table-header { display: flex; padding: 15px 20px; border-bottom: 1px solid var(--border-color); font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .table-row { display: flex; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--border-color); transition: 0.2s; }
        .table-row:last-child { border-bottom: none; }
        .table-row:hover { background-color: rgba(255,255,255,0.03); }

        /* Badges e Textos da Tabela */
        .badge-ativo { background-color: #10b981; color: white; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .badge-bloqueado { background-color: #ef4444; color: white; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .text-isento { color: #10b981; font-weight: bold; font-size: 12px; text-transform: uppercase; }
        .text-trial { color: #38bdf8; font-weight: bold; font-size: 12px; text-transform: uppercase; }
        .text-expirado { color: #ef4444; font-weight: bold; font-size: 12px; text-transform: uppercase; }
        .text-pendente { color: #f43f5e; font-weight: bold; font-size: 12px; text-transform: uppercase; }
        
        /* Botões Tabela */
        .btn-action { padding: 6px 12px; border: none; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; color: white; }
        .btn-cobrar { background-color: #10b981; margin-right: 8px; }
        .btn-historico { background-color: #475569; }
    </style>
</head>
<body>

    <div class="app-layout">
        
        <!-- SIDEBAR ESQUERDA -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>PsiTech Admin</h2>
                <p>Controlador: <strong id="nomeAdminLogado">Gestor ADM</strong></p>
            </div>
            
            <nav class="sidebar-menu">
                <button class="menu-btn active" data-target="tab-admin-dash">Dashboard Financeiro</button>
                <button class="menu-btn" data-target="tab-admin-profissionais">Gestão de Psicólogos</button>
            </nav>
            
            <div class="sidebar-footer">
                <!-- Botão fiel à sua foto 2 -->
                <button id="btnSairAdmin" class="btn-sair-outline">Sair do Painel</button>
            </div>
        </aside>

        <!-- ÁREA PRINCIPAL -->
        <main class="content-area">
            
            <!-- ABA 1: DASHBOARD FINANCEIRO -->
            <section id="tab-admin-dash" class="tab-content active">
                <h1 class="page-title">Receita da Plataforma</h1>
                
                <div class="kpi-grid">
                    <div class="kpi-card">
                        <h3>Profissionais</h3>
                        <p id="kpi_psicologos">0</p>
                    </div>
                    <div class="kpi-card green">
                        <h3>Receita Paga</h3>
                        <p id="kpi_recebido">R$ 0.00</p>
                    </div>
                    <div class="kpi-card red">
                        <h3>Pendente</h3>
                        <p id="kpi_pendente">R$ 0.00</p>
                    </div>
                </div>
            </section>

            <!-- ABA 2: GESTÃO DE PROFISSIONAIS -->
            <section id="tab-admin-profissionais" class="tab-content">
                <h1 class="page-title">Gestão de Profissionais</h1>

                <input type="text" id="buscaPsi" placeholder="Buscar profissional pelo nome ou e-mail..." class="search-box" onkeyup="window.filtrarTabela()">

                <div class="table-container">
                    <div class="table-header">
                        <div style="width:30%;">PSICÓLOGO</div>
                        <div style="width:15%; text-align:center;">ACESSO</div>
                        <div style="width:20%; text-align:center;">MENSALIDADE</div>
                        <div style="width:15%; text-align:center;">FINANCEIRO</div>
                        <div style="width:20%; text-align:right;">AÇÕES</div>
                    </div>
                    
                    <div class="lista-profissionais" id="tabela_corpo">
                        <!-- Itens renderizados pelo admin.js -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Container dos Modais -->
    <div id="containerModaisAdmin"></div>

    <script type="module" src="../js/admin.js"></script>
</body>
</html>
