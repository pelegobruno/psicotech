<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Psicomind</title>
    
    <link rel="icon" href="../img/favicon.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="split-layout">
        <div class="branding-panel">
            <div class="branding-content">
                <img src="../img/logo.png" alt="Psicomind Logo" style="max-height: 60px; margin-bottom: 20px; filter: brightness(0) invert(1);">
                <h1>Junte-se à Psicomind</h1>
                <p>Crie sua conta e experimente o sistema completo com 30 dias grátis.</p>
                <div class="features-list">
                    <span>✓ Sem cartão de crédito</span>
                    <span>✓ Suporte Dedicado</span>
                    <span>✓ Migração de dados fácil</span>
                </div>
            </div>
            <div class="overlay"></div>
        </div>

        <div class="login-panel">
            <div class="login-box">
                <div class="mobile-logo" style="text-align: center; margin-bottom: 20px;">
                    <img src="../img/logo.png" alt="Psicomind" style="max-height: 50px;">
                </div>

                <div class="login-header">
                    <h2>Criar Conta</h2>
                    <p>Preencha os dados abaixo para iniciar seu período de teste na Psicomind.</p>
                </div>

                <form id="cadastroForm">
                    <div class="input-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" placeholder="Dr(a). Nome Sobrenome" required>
                    </div>

                    <div class="input-group">
                        <label for="profissao">Área de Atuação</label>
                        <select id="profissao" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none; font-family: inherit; font-size: 14px; background: white;">
                            <option value="" disabled selected>Selecione sua profissão...</option>
                            <option value="Psicólogo">Psicólogo(a)</option>
                            <option value="Neuropsicólogo">Neuropsicólogo(a)</option>
                            <option value="Psicopedagogo">Psicopedagogo(a)</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="crp">Registro Profissional (Opcional)</label>
                        <input type="text" id="crp" placeholder="Ex: CRP 00/00000">
                    </div>

                    <div class="input-group">
                        <label for="email">E-mail Profissional</label>
                        <input type="email" id="email" placeholder="dr@clinica.com.br" required>
                    </div>

                    <div class="input-group">
                        <label for="senha">Crie uma Senha</label>
                        <input type="password" id="senha" placeholder="Mínimo de 6 caracteres" required minlength="6">
                    </div>

                    <button type="submit" class="btn-login">Finalizar Cadastro</button>
                </form>

                <div id="mensagem-aviso" class="mensagem-erro" style="background-color: #f0fdf4; color: #166534; border-color: #bbf7d0; display:none;"></div>
                <div id="mensagem-erro" class="mensagem-erro" style="display:none;"></div>
                
                <div class="cadastro-link">
                    <p>Já tem uma conta? <a href="../index.html">Faça login</a></p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/cadastro.js"></script>
</body>
</html>
